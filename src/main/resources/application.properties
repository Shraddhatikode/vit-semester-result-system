# Server Configuration
server.port=8080
spring.application.name=VIT Student Semester Result System

# Database Driver Configuration
# To use Remote/Cloud MySQL, set DB_URL, DB_USERNAME, DB_PASSWORD environment variables or update the values below.
# Default fallback uses H2 in MySQL-compatibility mode for zero-dependency local testing.

# Active profile selection (h2 or mysql)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# ===================================================================
# DEFAULT LOCAL FALLBACK PROFILE (H2 in-memory with MySQL dialect)
# Allows running application instantly without local/remote MySQL setup
# ===================================================================
spring.datasource.url=jdbc:h2:mem:vit_result;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Static Resources Handling
spring.web.resources.static-locations=classpath:/static/
